
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Фонарик Genially</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .dark-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(
        circle 150px at var(--x, 50%) var(--y, 50%),
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.95) 100%
      );
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="dark-layer" id="mask"></div>

  <script>
    const mask = document.getElementById("mask");
    document.addEventListener("mousemove", (e) => {
      mask.style.setProperty("--x", `${e.clientX}px`);
      mask.style.setProperty("--y", `${e.clientY}px`);
    });
  </script>
</body>
</html>
