<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Фонарик Genially</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      cursor: none; /* Скрывает обычный курсор */
      background-color: black; /* Черный фон */
    }

    .spotlight {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="spotlight" id="spotlight"></div>

  <script>
    const spotlight = document.getElementById("spotlight");

    // Обработка события движения мыши
    document.addEventListener("mousemove", (e) => {
      const x = e.clientX;
      const y = e.clientY;

      // Двигаем фокус (spotlight) и обновляем его позицию
      spotlight.style.left = `${x}px`;
      spotlight.style.top = `${y}px`;
    });
  </script>
</body>
</html>
