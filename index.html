<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Фонарик-просвет</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      overflow: hidden;
      cursor: none;
    }

    .darkness {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* Темнота */
      pointer-events: none;
      mask-image: radial-gradient(circle 120px at center, transparent 0%, black 100%);
      mask-position: -200px -200px;
      mask-repeat: no-repeat;
      -webkit-mask-image: radial-gradient(circle 120px at center, transparent 0%, black 100%);
      -webkit-mask-position: -200px -200px;
      -webkit-mask-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div class="darkness" id="darkness"></div>

  <script>
    const darkness = document.getElementById("darkness");

    document.addEventListener("mousemove", (e) => {
      darkness.style.maskPosition = `${e.clientX}px ${e.clientY}px`;
      darkness.style.webkitMaskPosition = `${e.clientX}px ${e.clientY}px`;
    });
  </script>
</body>
</html>
